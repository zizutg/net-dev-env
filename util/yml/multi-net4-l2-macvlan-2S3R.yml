networks:
  net-LAN-A:
    name: net4-LAN-A
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

  net-LAN-B:
    name: net4-LAN-B
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 172.21.1.0/24
          gateway: 172.21.1.1

  net-INET:
    name: net4-INET
    driver: bridge


services:
  HostA:
    image: zizutg/net-ub22-host
    container_name: HA
    hostname: HA
    privileged: true
    tty: true
    cap_add:
      - ALL
    mac_address: 02:22:22:22:22:22
    networks:
      net-LAN-A:
        ipv4_address: 172.21.0.2
    command: >
      bash -lc "
      mkdir -p /tmp &&
      tail -f /dev/null
      "

  HostB:
    image: zizutg/net-ub22-host
    container_name: HB
    hostname: HB
    privileged: true
    tty: true
    cap_add:
      - ALL
    mac_address: 02:44:44:44:44:44
    networks:
      net-LAN-A:
        ipv4_address: 172.21.0.4
      net-LAN-B:
        ipv4_address: 172.21.1.44
      net-INET: {}
    command: >
      bash -lc "
      mkdir -p /tmp;
      apt-get update &&
      apt-get install -y bridge-utils &&
      exec tail -f /dev/null
      "

  HostC:
    image: zizutg/net-ub22-host
    container_name: HC
    hostname: HC
    privileged: true
    tty: true
    cap_add:
      - ALL
    mac_address: 02:55:55:55:55:55
    networks:
      net-LAN-A:
        ipv4_address: 172.21.0.5
      net-LAN-B:
        ipv4_address: 172.21.1.45
      net-INET: {}
    command: >
      bash -lc "
      mkdir -p /tmp;
      apt-get update &&
      apt-get install -y bridge-utils &&
      exec tail -f /dev/null
      "
