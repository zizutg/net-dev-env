services:
  Router1:
    image: zizutg/multi-router
    container_name: R1
    hostname: R1
    privileged: true
    tty: true
    sysctls: 
      - net.ipv4.ip_forward=1
    cap_add:
      - ALL
    networks:
      net4-45:
        ipv4_address: 172.21.45.254
      net4-46:
        ipv4_address: 172.21.46.254
    command: bash -c "
                      mkdir -p /tmp
                      && ip route delete default
                      && ip route add default via 172.21.46.254
                      && tail -f /dev/null
                     "
  Host1:
    image: zizutg/net-ub22-host
    container_name: HA
    hostname: HA
    privileged: true
    tty: true
    cap_add:
      - ALL
    networks:
      net4-45:
        ipv4_address: 172.21.45.5
    command: bash -c "
                      mkdir -p /tmp
                      && ip route delete default
                      && ip route add default via 172.21.45.254
                      && tail -f /dev/null
                     "
  Host2:
    image: zizutg/net-ub22-host
    container_name: HB
    hostname: HB
    privileged: true
    tty: true
    ports:
      - "80:80"
      - "2222:22"
    cap_add:
      - ALL
    networks:
      net4-46:
        ipv4_address: 172.21.46.5
    command: bash -c "
                      mkdir -p /tmp
                      && ip route delete default
                      && ip route add default via 172.21.46.254
                      && tail -f /dev/null
                     "
      


networks:
  net4-45:
    ipam: 
      config:
        - subnet: 172.21.45.0/24
  net4-46:
    ipam: 
      config:
        - subnet: 172.21.46.0/24
